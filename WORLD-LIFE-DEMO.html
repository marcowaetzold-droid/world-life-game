olor:var(--sub);font-size:12px}.price{color:var(--gold);font-weight:900}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--green);color:#08372a;font-weight:900}.btn.alt{background:#2c4961;color:#eef8ff}.btn.red{background:#794443;color:#ffe6e4}.btn.full{width:100%}.actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.actions .btn{flex:1}.art{height:127px;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(130deg,#526c8a,#213c59)}.art:before{content:'';position:absolute;top:-85px;right:-35px;width:200px;height:200px;border-radius:50%;background:#ffffff0b}.art.house{background:linear-gradient(130deg,#538d87,#274c62)}.art.tech{background:linear-gradient(130deg,#6f628d,#34415e)}.art.work{background:linear-gradient(130deg,#927758,#3c5149)}.art .emoji{font-size:72px;filter:drop-shadow(0 10px 7px #0006);z-index:1}.layout{display:grid;grid-template-columns:1.55fr 1fr;gap:13px}.panel{padding:15px}.map{height:440px;position:relative;border-radius:15px;overflow:hidden;background:radial-gradient(ellipse at 15% 15%,#77ae92 0 16%,transparent 17%),radial-gradient(ellipse at 80% 88%,#7ca27b 0 18%,transparent 19%),linear-gradient(130deg,#85b69f,#578b77 55%,#45705e);isolation:isolate}.lake{position:absolute;top:5%;left:3%;width:36%;height:27%;border-radius:56% 44% 65% 35%;background:#429cc0;border:7px solid #acd2c1;transform:rotate(-14deg)}.road{position:absolute;background:#c9bca1;border:3px solid #e8d9b6;border-radius:25px;z-index:1;box-shadow:0 2px 3px #0002}.r1{width:135%;height:20px;top:53%;left:-15%;transform:rotate(-16deg)}.r2{height:125%;width:20px;left:55%;top:-12%;transform:rotate(25deg)}.r3{width:115%;height:14px;left:-5%;top:74%;transform:rotate(30deg)}.r4{width:90%;height:12px;left:12%;top:24%;transform:rotate(-36deg)}.pin{position:absolute;z-index:3;transform:translate(-50%,-50%);border:2px solid #ffffffb0;border-radius:13px;background:#19394be8;color:white;padding:6px;min-width:82px;max-width:115px;text-align:center;box-shadow:0 5px 12px #0004}.pin .e{font-size:27px;display:block;line-height:1.2}.pin small{font-size:11px;font-weight:800}.pin.selected{border-color:#ffda83;background:#2d6553;box-shadow:0 0 0 4px #ffda8344}.rowitem{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:12px 0}.rowitem:last-child{border:0}.rowitem strong{display:block}.rowitem small{color:var(--sub)}.notice{margin:11px 0;padding:11px 13px;background:#244d47;border:1px solid #4da98a;border-radius:11px;color:#d8fff1}.bad{background:#603b3b;border-color:#a66060;color:#ffe3e3}.pill{border-radius:30px;background:#2c4559;padding:5px 9px;font-size:12px}.flex{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.space{justify-content:space-between}.number{font-weight:900;color:var(--gold)}.footer{color:#8298aa;font-size:11px;margin-top:22px;text-align:center}.empty{padding:24px;text-align:center;color:var(--sub)}.modalbg{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(100%,530px);background:#1a3043;border:1px solid #5a7485;border-radius:22px;padding:20px;max-height:88vh;overflow:auto;box-shadow:0 18px 70px #0009}.modal h2{margin:0 0 7px}.modal input{background:#0f2131;color:white;border:1px solid #5d7384;border-radius:10px;padding:11px;width:100%}.sep{border:0;border-top:1px solid var(--border);margin:14px 0}.progress{height:9px;background:#0a1925;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#5ed7a8,#ffcd73)}@media(max-width:750px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.map{height:370px}}@media(max-width:390px){.grid{gap:8px}.tile-body{padding:10px}.art{height:105px}.art .emoji{font-size:58px}.pin{min-width:70px;padding:5px}.pin small{font-size:10px}.brand{font-size:20px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="kicker">DEIN LEBEN. DEINE ENTSCHEIDUNGEN.</div><div class="brand">🌍 WORLD <b>LIFE</b></div></div><div class="chip">● SPIELBARE DEMO</div></div><div id="stats" class="stats"></div><div id="tabs" class="tabs"></div><div id="message"></div><main id="view"></main><div class="footer">WORLD LIFE · Eigenständige Demo · Fortschritt wird auf diesem Gerät gespeichert · Keine echten Käufe</div></div><div id="overlay"></div>
<script>
'use strict';
const KEY='world_life_demo_2026_1', money=n=>Math.round(n).toLocaleString('de-DE')+' €',esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const places=[{id:'city',name:'Stadtzentrum',emoji:'🏙️',km:2,rent:1.35,x:51,y:48,desc:'Zentral, kurze Wege, hohe Mieten'},{id:'suburb',name:'Vorstadt',emoji:'🏘️',km:8,rent:1.05,x:77,y:27,desc:'Familienfreundlich, mittlere Mieten'},{id:'lake',name:'Seedorf',emoji:'🌅',km:23,rent:.79,x:20,y:28,desc:'Am See, günstiger, weiter zur Arbeit'},{id:'forest',name:'Walddorf',emoji:'🌲',km:16,rent:.86,x:22,y:78,desc:'Natur, Ruhe, mittlere Fahrtstrecke'},{id:'farm',name:'Landdorf',emoji:'🚜',km:39,rent:.62,x:79,y:78,desc:'Sehr günstig, aber lange Fahrtwege'}];
const homes=[{id:'room',name:'Kleines Apartment',price:0,rent:540,emoji:'🏢',desc:'Einfacher Start ins eigene Leben'},{id:'flat',name:'Moderne Wohnung',price:0,rent:970,emoji:'🏠',desc:'Mehr Platz und Komfort'},{id:'loft',name:'Luxus-Penthouse',price:0,rent:2500,emoji:'🌆',desc:'Wohnen mit Stil und Aussicht'}];
const jobs=[{id:'delivery',name:'Lieferdienst',salary:2050,emoji:'🛵',desc:'Einfacher Einstieg, flexibler Job'},{id:'office',name:'Büroangestellter',salary:3100,emoji:'💼',desc:'Sicheres Einkommen'},{id:'engineer',name:'Ingenieur',salary:5100,emoji:'👷',desc:'Gut bezahlt, anspruchsvoll'},{id:'manager',name:'Manager',salary:8200,emoji:'🧑‍💼',desc:'Spitzengehalt, hohe Verantwortung'}];
const products=[
{id:'bike',name:'Citybike',price:350,emoji:'🚲',type:'Mobilität',class:'car',monthly:0},{id:'scooter',name:'Motorroller',price:1600,emoji:'🛵',type:'Mobilität',class:'car',monthly:35},{id:'polo',name:'VW Polo',price:12500,emoji:'🚙',type:'Auto',class:'car',monthly:165},{id:'golf',name:'VW Golf',price:25500,emoji:'🚗',type:'Auto',class:'car',monthly:235},{id:'bmw',name:'BMW 3er',price:44500,emoji:'🚘',type:'Auto',class:'car',monthly:390},{id:'porsche',name:'Porsche 911',price:139000,emoji:'🏎️',type:'Auto',class:'car',monthly:1100},
{id:'phone',name:'Smartphone',price:450,emoji:'📱',type:'Technik',class:'tech',monthly:0},{id:'laptop',name:'Laptop',price:990,emoji:'💻',type:'Technik',class:'tech',monthly:0},{id:'tv',name:'55-Zoll-TV',price:690,emoji:'📺',type:'Technik',class:'tech',monthly:0},{id:'console',name:'Spielkonsole',price:530,emoji:'🎮',type:'Technik',class:'tech',monthly:0},
{id:'sofa',name:'Ecksofa',price:1100,emoji:'🛋️',type:'Möbel',class:'house',monthly:0},{id:'bed',name:'Komfortbett',price:780,emoji:'🛏️',type:'Möbel',class:'house',monthly:0},{id:'coffee',name:'Kaffeemaschine',price:190,emoji:'☕',type:'Haushalt',class:'house',monthly:0},{id:'watch',name:'Luxusuhr',price:7800,emoji:'⌚',type:'Luxus',class:'tech',monthly:0},{id:'boat',name:'Motorboot',price:38000,emoji:'🛥️',type:'Luxus',class:'car',monthly:250},{id:'art',name:'Kunstwerk',price:3500,emoji:'🖼️',type:'Luxus',class:'house',monthly:0}];
const ventures=[{id:'kiosk',name:'Kleiner Kiosk',price:9500,monthly:420,emoji:'🏪',desc:'Dein erstes Geschäft'},{id:'cafe',name:'Café',price:38000,monthly:1250,emoji:'☕',desc:'Kaffee und Kuchen verkaufen'},{id:'shop',name:'Elektronikladen',price:85000,monthly:2900,emoji:'🏬',desc:'Technikhandel mit Gewinnchance'},{id:'dealer',name:'Autohaus',price:230000,monthly:7100,emoji:'🚘',desc:'Autos kaufen und verkaufen'}];
function fresh(){return{balance:18000,day:1,location:'city',home:'room',job:'delivery',items:[],listings:[],businesses:[],feed:['Willkommen bei WORLD LIFE! Entscheide selbst, wie du leben möchtest.'],happiness:68,earned:0,spent:0}}let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}if(!Array.isArray(s.items)||!Array.isArray(s.listings)||!Array.isArray(s.businesses))s=fresh();let tab='map',filter='Alle',msg='',modal=null;
const byId=(arr,id)=>arr.find(x=>x.id===id),place=()=>byId(places,s.location),home=()=>byId(homes,s.home),job=()=>byId(jobs,s.job),rent=()=>Math.round(home().rent*place().rent),car=()=>s.items.find(x=>['polo','golf','bmw','porsche'].includes(x.id)),commute=()=>Math.round(place().km*2*22*(car()?.id==='porsche'?.32:car()?.id==='bmw'?.27:car()?.id==='golf'?.21:car()?.id==='polo'?.19:.29)),upkeep=()=>s.items.reduce((v,x)=>v+(byId(products,x.id)?.monthly||0),0),income=()=>job().salary+s.businesses.reduce((v,id)=>v+(byId(ventures,id)?.monthly||0),0),expenses=()=>rent()+commute()+upkeep()+450,net=()=>income()-expenses();
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}function note(t,bad=false){msg='<div class="notice '+(bad?'bad':'')+'">'+esc(t)+'</div>'}function event(t){s.feed.unshift('Tag '+s.day+': '+t);s.feed=s.feed.slice(0,30)}function charge(amount){if(s.balance<amount){note('Nicht genug Geld. Es fehlen '+money(amount-s.balance)+'.',true);render();return false}s.balance-=amount;s.spent+=amount;return true}function earn(amount){s.balance+=amount;s.earned+=amount}function done(t){note(t);event(t);save();render()}function navigate(t){tab=t;msg='';render();window.scrollTo({top:0,behavior:'smooth'})}
function selectPlace(id){let p=byId(places,id);if(!p)return;if(id===s.location){note('Hier wohnst du bereits.');render();return}modal={kind:'move',id};render()}function confirmMove(){let p=byId(places,modal.id);if(!charge(180))return;s.location=p.id;s.happiness=Math.min(100,s.happiness+2);modal=null;done('Umzug nach '+p.name+'! Fahrtkosten jetzt '+money(commute())+'/Monat.')}
function chooseHome(id){let h=byId(homes,id);if(!h||id===s.home)return;let cost=Math.round(h.rent*place().rent*.7);if(!charge(cost))return;s.home=id;s.happiness=Math.min(100,s.happiness+5);done('Neues Zuhause: '+h.name+'. Einmalige Umzugskosten '+money(cost)+'.')}
function chooseJob(id){let j=byId(jobs,id);if(!j||id===s.job)return;s.job=id;s.happiness=Math.max(20,s.happiness-2);done('Neuer Beruf: '+j.name+' mit '+money(j.salary)+' Monatsgehalt.')}
function buy(id){let p=byId(products,id);if(!p||!charge(p.price))return;s.items.push({uid:Date.now()+'-'+Math.random().toString(36).slice(2,7),id:p.id,paid:p.price});modal=null;s.happiness=Math.min(100,s.happiness+1);done(p.name+' für '+money(p.price)+' gekauft. Der Gegenstand ist im Inventar.')}
function openSell(uid){let item=s.items.find(x=>x.uid===uid);if(!item)return;let p=byId(products,item.id);modal={kind:'sell',uid,price:Math.round(p.price*.65)};render()}
function listItem(){let item=s.items.find(x=>x.uid===modal.uid);if(!item)return;let price=Math.round(Number(document.getElementById('askPrice').value));if(!Number.isFinite(price)||price<1||price>10000000){note('Bitte einen gültigen Preis eingeben.',true);modal=null;render();return}s.items=s.items.filter(x=>x.uid!==item.uid);s.listings.push({uid:item.uid,id:item.id,ask:price,days:0});modal=null;done(byId(products,item.id).name+' für '+money(price)+' bei Kleinanzeigen eingestellt.')}
function delist(uid){let l=s.listings.find(x=>x.uid===uid);if(!l)return;s.listings=s.listings.filter(x=>x.uid!==uid);s.items.push({uid:l.uid,id:l.id,paid:byId(products,l.id).price});done('Anzeige beendet. Gegenstand ist wieder im Inventar.')}
function buyBusiness(id){let v=byId(ventures,id);if(!v||s.businesses.includes(id)||!charge(v.price))return;s.businesses.push(id);s.happiness=Math.min(100,s.happiness+6);done('Unternehmen gegründet: '+v.name+'. Erwarteter monatlicher Überschuss '+money(v.monthly)+'.')}
function nextMonth(){s.day+=30;let revenue=income(),cost=expenses();earn(revenue);s.balance-=cost;s.spent+=cost;s.happiness=Math.max(10,Math.min(100,s.happiness+(net()>=0?2:-5)));let sold=[];s.listings=s.listings.filter(l=>{l.days++;let p=byId(products,l.id);let fair=p.price*.67;let chance=l.ask<=fair?.66:l.ask<=p.price?.34:.12;if(Math.random()<chance){let offer=Math.round(l.ask*(.88+Math.random()*.12));earn(offer);sold.push(p.name+' für '+money(offer));return false}return true});event('Monatsabrechnung: Einnahmen '+money(revenue)+', Ausgaben '+money(cost)+'.');if(sold.length)event('Kleinanzeigen verkauft: '+sold.join(', '));save();note('30 Tage vergangen. Netto '+(net()>=0?'+':'')+money(net())+'. '+(sold.length?'Verkauft: '+sold.join(', '):'Deine Anzeigen bleiben aktiv.'));render()}
function restart(){if(!confirm('Nur den DEMO-Spielstand wirklich neu starten? Dein bisheriges WORLD LIFE 4/5 wird NICHT verändert.'))return;s=fresh();modal=null;msg='';save();render()}
function art(emoji,type=''){return '<div class="art '+type+'"><span class="emoji">'+emoji+'</span></div>'}function card(title,body){return '<div class="panel"><h3 style="margin:0 0 10px">'+title+'</h3>'+body+'</div>'}function button(text,call,cl=''){return '<button class="btn '+cl+'" onclick="'+call+'">'+text+'</button>'}function productCard(p){return '<div class="tile">'+art(p.emoji,p.class)+'<div class="tile-body"><div class="small muted">'+esc(p.type)+'</div><h3>'+esc(p.name)+'</h3><div class="price">'+money(p.price)+'</div><div class="actions">'+button('Kaufen','buy(\''+p.id+'\')','full')+'</div></div></div>'}
function mapHTML(){return '<div class="map"><div class="lake"></div><div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><div class="road r4"></div>'+places.map(p=>'<button class="pin '+(p.id===s.location?'selected':'')+'" style="left:'+p.x+'%;top:'+p.y+'%" onclick="selectPlace(\''+p.id+'\')"><span class="e">'+p.emoji+'</span><small>'+p.name+'</small></button>').join('')+'</div>'}
function mapView(){return '<div class="hero"><h1>🗺️ Deine Welt wartet</h1><p>Wähle deinen Wohnort. Auf dem Land sparst du Miete, zahlst aber mehr für den Arbeitsweg. Tippe auf die Orte in der Karte.</p></div><div class="layout"><div class="panel">'+mapHTML()+'<p class="muted small">🏙️ Arbeitsort: Stadtzentrum · 🛣️ 22 Arbeitstage pro Monat · 📍 Umzug: 180 €</p></div><div class="panel"><h2 style="margin:0 0 10px">📍 Dein Wohnort</h2>'+places.map(p=>'<div class="rowitem"><div><strong>'+p.emoji+' '+p.name+(p.id===s.location?' ✓':'')+'</strong><small>'+p.km+' km einfach · Miete '+money(Math.round(home().rent*p.rent))+'<br>Fahrtkosten ca. '+money(Math.round(p.km*44*(car()?.id==='porsche'?.32:car()?.id==='bmw'?.27:car()?.id==='golf'?.21:car()?.id==='polo'?.19:.29)))+'/Monat</small></div>'+button(p.id===s.location?'Aktuell':'Wählen','selectPlace(\''+p.id+'\')',p.id===s.location?'alt':'')+'</div>').join('')+'</div></div>'}
function overview(){let progress=Math.max(0,Math.min(100,Math.round((s.balance+Math.max(0,s.businesses.length*5000))/150000*100)));return '<div class="hero"><h1>👋 Willkommen in deinem Leben</h1><p>Du entscheidest: Karriere machen, günstig auf dem Land wohnen, Autos sammeln oder ein Unternehmen aufbauen.</p><div class="actions">'+button('🗺️ Stadt erkunden',"navigate('map')")+button('⏭️ 30 Tage spielen','nextMonth()','alt')+'</div></div><div class="layout">'+card('🏡 Dein Alltag','<div class="rowitem"><span>Wohnort</span><strong>'+place().name+'</strong></div><div class="rowitem"><span>Wohnung</span><strong>'+home().name+'</strong></div><div class="rowitem"><span>Beruf</span><strong>'+job().name+'</strong></div><div class="rowitem"><span>Monatliches Einkommen</span><strong style="color:var(--green)">'+money(income())+'</strong></div><div class="rowitem"><span>Gesamtausgaben</span><strong>'+money(expenses())+'</strong></div><div class="rowitem"><span>Davon Fahrtkosten</span><strong>'+money(commute())+'</strong></div><div class="rowitem"><span>Monatlicher Überschuss</span><strong style="color:'+(net()>=0?'var(--green)':'var(--red)')+'">'+money(net())+'</strong></div>')+card('🎯 Dein Fortschritt','<p class="muted">Ziel: 150.000 € Vermögen aufbauen</p><div class="progress"><i style="width:'+progress+'%"></i></div><p><strong>'+progress+' %</strong> erreicht</p><p>😊 Lebenszufriedenheit: <strong>'+s.happiness+'/100</strong></p><p>🎒 Besitz: <strong>'+s.items.length+' Gegenstände</strong></p><p>🏪 Unternehmen: <strong>'+s.businesses.length+'</strong></p><hr class="sep"><h3>📜 Letzte Ereignisse</h3>'+s.feed.slice(0,5).map(t=>'<p class="small muted">• '+esc(t)+'</p>').join(''))+'</div>'}
function shopView(){let types=['Alle',...new Set(products.map(p=>p.type))];let arr=filter==='Alle'?products:products.filter(p=>p.type===filter);return '<div class="hero"><h1>🛍️ Einkaufswelt</h1><p>Autos, Technik, Möbel und Luxusgüter. Alles, was du kaufst, landet in deinem Inventar und kann später verkauft werden.</p></div><div class="flex" style="margin-bottom:12px">'+types.map(t=>button(t,'setFilter(\''+t+'\')',filter===t?'':'alt')).join('')+'</div><div class="grid">'+arr.map(productCard).join('')+'</div>'}function setFilter(t){filter=t;render()}
function inventoryView(){return '<div class="hero"><h1>🎒 Dein Inventar</h1><p>Alle deine Besitztümer. Verkaufe gebrauchte Dinge über Kleinanzeigen – dein Preis beeinflusst die Verkaufschance.</p></div><div class="section"><h2>Deine Gegenstände ('+s.items.length+')</h2></div>'+(s.items.length?'<div class="grid">'+s.items.map(i=>{let p=byId(products,i.id);return '<div class="tile">'+art(p.emoji,p.class)+'<div class="tile-body"><h3>'+p.name+'</h3><p>Gekauft für '+money(i.paid)+'</p><div class="price">Gebrauchtwert ca. '+money(p.price*.65)+'</div><div class="actions">'+button('📣 Verkaufen','openSell(\''+i.uid+'\')','full')+'</div></div></div>'}).join('')+'</div>':'<div class="panel empty">Noch keine Gegenstände. Besuche den Shop!</div>')+'<div class="section"><h2>📣 Deine Kleinanzeigen ('+s.listings.length+')</h2></div>'+card('Aktive Angebote',s.listings.length?s.listings.map(l=>'<div class="rowitem"><div><strong>'+byId(products,l.id).emoji+' '+byId(products,l.id).name+'</strong><small>Preis: '+money(l.ask)+' · Seit '+l.days+' Monaten online</small></div>'+button('Zurückholen','delist(\''+l.uid+'\')','alt')+'</div>').join(''):'<p class="muted">Keine aktiven Anzeigen.</p>')}
function housingView(){return '<div class="hero"><h1>🏡 Wohnen & Leben</h1><p>Deine Wohnung beeinflusst die monatlichen Ausgaben. Die Miete hängt zusätzlich von deinem Wohnort ab.</p></div><div class="grid">'+homes.map(h=>'<div class="tile">'+art(h.emoji,'house')+'<div class="tile-body"><h3>'+h.name+'</h3><p>'+h.desc+'</p><div class="price">'+money(Math.round(h.rent*place().rent))+' / Monat</div><div class="actions">'+button(h.id===s.home?'✓ Dein Zuhause':'Einziehen','chooseHome(\''+h.id+'\')',h.id===s.home?'alt full':'full')+'</div></div></div>').join('')+'</div>'}
function careerView(){return '<div class="hero"><h1>💼 Karriere</h1><p>Steigere dein Einkommen. Dein Gehalt wird alle 30 Spieltage ausgezahlt. Berufe sind in dieser Demo direkt wählbar.</p></div><div class="grid">'+jobs.map(j=>'<div class="tile">'+art(j.emoji,'work')+'<div class="tile-body"><h3>'+j.name+'</h3><p>'+j.desc+'</p><div class="price">'+money(j.salary)+' / Monat</div><div class="actions">'+button(j.id===s.job?'✓ Aktueller Job':'Job annehmen','chooseJob(\''+j.id+'\')',j.id===s.job?'alt full':'full')+'</div></div></div>').join('')+'</div>'}
function businessView(){return '<div class="hero"><h1>🏪 Dein Unternehmerleben</h1><p>Gründe Geschäfte, investiere Kapital und baue wiederkehrende Einnahmen auf. Die Demo verwendet feste monatliche Überschüsse.</p></div><div class="grid">'+ventures.map(v=>'<div class="tile">'+art(v.emoji,'work')+'<div class="tile-body"><h3>'+v.name+'</h3><p>'+v.desc+'</p><div class="price">Investition: '+money(v.price)+'</div><p style="color:var(--green)">+ '+money(v.monthly)+' / Monat</p><div class="actions">'+button(s.businesses.includes(v.id)?'✓ In deinem Besitz':'Gründen','buyBusiness(\''+v.id+'\')',s.businesses.includes(v.id)?'alt full':'full')+'</div></div></div>').join('')+'</div>'}
function financeView(){return '<div class="hero"><h1>🏦 Bank & Finanzen</h1><p>Behalte Einnahmen, Miete, Pendelkosten und Investitionen im Blick.</p></div><div class="layout">'+card('💳 Kontoauszug','<div class="rowitem"><span>Kontostand</span><strong class="number">'+money(s.balance)+'</strong></div><div class="rowitem"><span>Gehalt</span><strong>'+money(job().salary)+'</strong></div><div class="rowitem"><span>Unternehmensüberschuss</span><strong>'+money(income()-job().salary)+'</strong></div><div class="rowitem"><span>Miete</span><strong>'+money(rent())+'</strong></div><div class="rowitem"><span>Arbeitsweg</span><strong>'+money(commute())+'</strong></div><div class="rowitem"><span>Fahrzeugunterhalt</span><strong>'+money(upkeep())+'</strong></div><div class="rowitem"><span>Lebenshaltung</span><strong>'+money(450)+'</strong></div><div class="rowitem"><span>Monatliches Ergebnis</span><strong>'+money(net())+'</strong></div><div class="actions">'+button('⏭️ Nächster Monat','nextMonth()','full')+'</div>')+card('⚙️ Spielstand','<p>Dein Demo-Spielstand wird automatisch lokal in diesem Browser gespeichert.</p><p class="muted small">Diese Demo verwendet einen eigenen Speicherbereich und verändert deinen bisherigen WORLD-LIFE-Spielstand nicht.</p><div class="rowitem"><span>Gesamt verdient</span><strong>'+money(s.earned)+'</strong></div><div class="rowitem"><span>Gesamt ausgegeben</span><strong>'+money(s.spent)+'</strong></div><div class="actions">'+button('Demo zurücksetzen','restart()','red full')+'</div>')+'</div>'}
function renderModal(){let root=document.getElementById('overlay');if(!modal){root.innerHTML='';return}let body='';if(modal.kind==='move'){let p=byId(places,modal.id);body='<h2>'+p.emoji+' Nach '+p.name+' ziehen?</h2><p>'+p.desc+'</p><div class="rowitem"><span>Neue Miete</span><strong>'+money(Math.round(home().rent*p.rent))+'/Monat</strong></div><div class="rowitem"><span>Arbeitsweg</span><strong>'+p.km+' km einfach</strong></div><div class="rowitem"><span>Fahrtkosten</span><strong>'+money(Math.round(p.km*44*(car()?.id==='porsche'?.32:car()?.id==='bmw'?.27:car()?.id==='golf'?.21:car()?.id==='polo'?.19:.29)))+'/Monat</strong></div><div class="rowitem"><span>Einmalige Umzugskosten</span><strong>180 €</strong></div><div class="actions">'+button('Abbrechen','closeModal()','alt')+button('Jetzt umziehen','confirmMove()')+'</div>'}else if(modal.kind==='sell'){let p=byId(products,s.items.find(i=>i.uid===modal.uid).id);body='<h2>📣 '+p.name+' verkaufen</h2><p>Lege deinen Verkaufspreis fest. Günstigere Anzeigen werden schneller verkauft.</p><label class="small muted" for="askPrice">Dein Angebotspreis in Euro</label><input id="askPrice" type="number" min="1" value="'+modal.price+'"><p class="small muted">Neupreis: '+money(p.price)+' · Richtwert gebraucht: '+money(p.price*.67)+'</p><div class="actions">'+button('Abbrechen','closeModal()','alt')+button('Anzeige erstellen','listItem()')+'</div>'}root.innerHTML='<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">'+body+'</div></div>'}
function closeModal(){modal=null;render()}
function render(){document.getElementById('stats').innerHTML='<div class="stat"><small>💳 Kontostand</small><strong>'+money(s.balance)+'</strong></div><div class="stat"><small>📆 Spieltag</small><strong>'+s.day+'</strong></div><div class="stat"><small>📍 Wohnort</small><strong>'+place().name+'</strong></div><div class="stat"><small>📈 Monatlicher Saldo</small><strong style="color:'+(net()>=0?'var(--green)':'var(--red)')+'">'+money(net())+'</strong></div>';let tabs=[['map','🗺️ Stadtkarte'],['overview','🏠 Übersicht'],['shop','🛍️ Shop'],['inventory','🎒 Inventar'],['housing','🏡 Wohnen'],['career','💼 Karriere'],['business','🏪 Unternehmen'],['finance','🏦 Bank']];document.getElementById('tabs').innerHTML=tabs.map(([id,name])=>'<button class="'+(tab===id?'on':'')+'" onclick="navigate(\''+id+'\')">'+name+'</button>').join('');document.getElementById('message').innerHTML=msg;document.getElementById('view').innerHTML=({map:mapView,overview,shop:shopView,inventory:inventoryView,housing:housingView,career:careerView,business:businessView,finance:financeView}[tab]||mapView)();renderModal()}
try{render()}catch(e){document.getElementById('view').innerHTML='<div class="notice bad">Fehler beim Spielstart: '+esc(e.message)+'</div>';console.error(e)}
</script></body></html>
