<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORLD LIFE 5</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#091723;color:#edf6fb;font:15px system-ui;margin:0}header,main{max-width:1050px;margin:auto;padding:16px}h1{margin:0}small,.muted{color:#a8bdc9}.stats,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.stat{background:#172b3d;border:1px solid #385269;border-radius:14px;padding:14px;margin-bottom:10px}.stat strong{display:block;font-size:20px}nav{display:flex;overflow-x:auto;gap:7px;padding:12px 0}button,select,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #547086;background:#27475e;color:white}button{cursor:pointer}button:disabled{opacity:.4}button.active{background:#28a987;color:#06261e}button.danger{background:#763e4a}nav button{white-space:nowrap}.item{background:#20384c;border-radius:10px;padding:12px;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.line{border-bottom:1px solid #385269;padding:8px 0}.notice{padding:12px;border-left:3px solid #eeb45d;background:#294155;border-radius:7px;margin:8px 0}select{max-width:100%}@media(max-width:650px){.grid{grid-template-columns:1fr}.stat strong{font-size:17px}}</style>
<header><h1>🌍 WORLD LIFE <small>TEST 4.1</small></h1><p class="muted">Dein Leben · Dein Besitz · Deine Wirtschaft</p><div id="clock"></div></header><main><div id="stats" class="stats"></div><nav id="nav"></nav><div id="message"></div><div id="view"></div></main>
<style>
.map-scene{position:relative;height:340px;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 18% 70%,#245d43 0 16%,transparent 17%),radial-gradient(ellipse at 78% 17%,#34764d 0 18%,transparent 19%),linear-gradient(145deg,#365d48,#6d865b 53%,#3d6955);border:2px solid #6d9575}
.map-water{position:absolute;left:3%;top:13%;width:32%;height:25%;border-radius:60% 40% 55% 45%;background:#287f9c;box-shadow:0 0 0 7px #84a784}
.map-road{position:absolute;background:#b9a88a;border:3px solid #e1d3ac;opacity:.95;border-radius:40px;transform-origin:center}
.road-a{width:115%;height:13px;left:-5%;top:51%;transform:rotate(-15deg)}
.road-b{width:13px;height:120%;left:52%;top:-10%;transform:rotate(28deg)}
.road-c{width:95%;height:9px;left:9%;top:66%;transform:rotate(35deg)}
.map-pin{position:absolute;transform:translate(-50%,-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 10px;border:2px solid #e2e8f0;border-radius:13px;background:#102c30ed;color:white;box-shadow:0 3px 12px #0007;max-width:120px;min-width:78px;line-height:1.1}
.map-pin span{font-size:27px}.map-pin small{font-size:11px;color:white}.map-pin.chosen{border-color:#f8c95d;background:#315c45}
.place-list{margin-top:16px}.place-list .item{gap:12px}.place-list button{flex-shrink:0}
</style><script>
window.addEventListener('error',function(e){var m=document.getElementById('message');if(m)m.innerHTML='<div class="notice">⚠️ Spielstart-Fehler: '+String(e.message).replace(/</g,'&lt;')+'<p>Bitte diesen Fehler als Screenshot schicken. Dein Spielstand bleibt erhalten.</p></div>';});
window.addEventListener('unhandledrejection',function(e){var m=document.getElementById('message');if(m)m.textContent='⚠️ Fehler: '+String(e.reason);});
</script><script>
'use strict';
const KEY='worldlife_test_30',DAY=3600000,fmt=n=>Math.round(n).toLocaleString('de-DE')+' €',esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const categories=[
['Elektronik','Fernseher',['32 Zoll LED',250,3],['55 Zoll 4K',650,6],['85 Zoll OLED',2600,9]],
['Elektronik','Smartphone',['Einsteiger-Smartphone',180,2],['Mittelklasse-Smartphone',490,5],['Premium-Smartphone',1350,8]],
['Elektronik','Laptop',['Basis-Laptop',420,3],['Business-Laptop',1100,6],['High-End-Laptop',2900,9]],
['Elektronik','Spielekonsole',['Gebrauchte Konsole',180,2],['Aktuelle Konsole',520,5],['Gaming-PC',2300,8]],
['Haushalt','Waschmaschine',['Einfach',330,3],['Energiesparend',750,6],['Premium',1700,8]],
['Haushalt','Kaffeemaschine',['Filtermaschine',45,1],['Vollautomat',680,4],['Premium-Siebträger',2800,7]],
['Möbel','Sofa',['Einfaches Sofa',290,2],['Ecksofa',1100,5],['Designersofa',6500,9]],
['Möbel','Bett',['Einfaches Bett',240,2],['Boxspringbett',1200,6],['Luxusbett',5500,9]],
['Mode','Kleidung',['Basic-Outfit',65,1],['Marken-Outfit',280,3],['Designer-Outfit',2400,6]],
['Mode','Uhr',['Alltagsuhr',35,1],['Markenuhr',550,3],['Luxusuhr',9500,6]],
['Sport','Fahrrad',['Citybike',280,2],['Sportfahrrad',1400,5],['Carbon-Rennrad',7500,8]],
['Sport','Fitnessgeräte',['Hanteln',70,1],['Heimtrainer',800,4],['Profi-Fitnessstudio',9000,8]],
['Freizeit','Musikinstrument',['Einsteiger-Gitarre',120,2],['E-Gitarre',950,5],['Konzertflügel',18000,9]],
['Freizeit','Boot',['Schlauchboot',300,2],['Motorboot',28000,6],['Luxusyacht',950000,10]],
['Freizeit','Reise',['Wochenendtrip',250,2],['Hotelurlaub',1900,6],['Luxusreise',12500,9]],
['Garten','Gartengeräte',['Handwerkzeug',60,1],['Rasenmäher',550,3],['Aufsitzmäher',6500,6]],
['Garten','Pflanzen',['Zimmerpflanze',12,1],['Große Pflanze',85,2],['Exotische Sammlung',1200,5]],
['Mobilität','Motorrad',['Gebrauchtes Motorrad',2200,3],['Mittelklasse-Motorrad',11000,6],['Premium-Motorrad',32000,9]],
['Mobilität','Wohnmobil',['Gebrauchter Camper',17000,4],['Neues Wohnmobil',78000,7],['Luxus-Wohnmobil',290000,10]],
['Werkstatt','Werkzeuge',['Werkzeugkasten',75,1],['Profi-Werkzeug',850,4],['Werkstattausrüstung',12000,7]]];
const goods=categories.flatMap(([category,type,...levels],j)=>levels.map(([variant,price,comfort],tier)=>({id:'g'+j+'_'+tier,name:type+' – '+variant,category,tier,price,comfort,repair:Math.round(price*.3)})));
const legacy=[['tv','Fernseher',520,6],['phone','Smartphone',430,5],['washer','Waschmaschine',610,8],['bike','Fahrrad',340,5],['laptop','Laptop',850,7],['console','Spielekonsole',390,5]].map(([id,name,price,comfort])=>({id,name,price,comfort,repair:Math.round(price*.3),category:'Klassiker'}));goods.push(...legacy);
const cars=[['none','Kein Auto',0,0,0],['used','Gebrauchtwagen',3900,165,5],['family','Familienauto',16500,335,9],['lux','Sportwagen',69000,980,15],['vw_polo','VW Polo',5500,190,4],['vw_golf','VW Golf',19500,320,7],['porsche','Porsche 911',125000,1100,13],['opel_corsa','Opel Corsa',4800,175,4],['opel_astra','Opel Astra',17500,310,7],['mercedes_s','Mercedes S-Klasse',118000,1100,13],['toyota_yaris','Toyota Yaris',6900,180,4],['toyota_corolla','Toyota Corolla',24000,300,7],['ferrari','Ferrari Roma',235000,1800,15],['bmw_1','BMW 1er',9500,250,5],['bmw_3','BMW 3er',31000,440,9],['bmw_m4','BMW M4',105000,1050,13],['audi_a1','Audi A1',8500,220,5],['audi_a4','Audi A4',29000,420,9],['audi_r8','Audi R8',145000,1400,14],['tesla_3','Tesla Model 3 gebraucht',23000,280,7],['tesla_y','Tesla Model Y',48000,390,9],['tesla_s','Tesla Model S Plaid',115000,760,13]].map(([id,name,price,cost,comfort])=>({id,name,price,cost,comfort}));
const homes=[{id:'room',name:'WG-Zimmer',rent:360,energy:80,comfort:55},{id:'flat',name:'2-Zimmer-Wohnung',rent:760,energy:175,comfort:75},{id:'house',name:'Einfamilienhaus',rent:1550,energy:465,comfort:90},{id:'villa',name:'Luxusvilla',rent:4500,energy:1540,comfort:100}];
const jobs=[{id:'service',name:'Servicekraft',salary:2100,need:0},{id:'driver',name:'Fahrer',salary:2600,need:0},{id:'tech',name:'Techniker',salary:3900,need:2},{id:'manager',name:'Betriebsleiter',salary:5400,need:4}];
const fresh=()=>({version:4,money:2400,day:1,stamp:Date.now(),job:'service',level:0,experience:0,lastWork:0,home:'room',car:'none',items:[],listings:[],offers:[],bank:[],events:[],stress:15,health:85,baseMood:82,debt:0,raise:0,food:'normal',hobby:'none',pets:[],insurance:{home:false,device:false,car:false,pet:false},travel:0,studyUntil:0,negotiation:0,company:false,companyRevenue:0,location:'zentrum'});
let s;try{s={...fresh(),...(JSON.parse(localStorage.getItem(KEY)||'null')||{})}}catch(e){s=fresh();document.getElementById('message').textContent='Hinweis: Spielstand konnte nicht gelesen werden: '+e.message}
for(let k of ['items','listings','offers','bank','events','pets'])if(!Array.isArray(s[k]))s[k]=[];
s.items=s.items.filter(x=>x&&typeof x==='object').map((x,i)=>({...x,uid:x.uid||('old'+i)}));s.listings=s.listings.filter(x=>x.uid);s.offers=s.offers.filter(x=>x.uid);
const find=(a,id)=>a.find(x=>x.id===id),car=()=>find(cars,s.car)||cars[0],home=()=>find(homes,s.home)||homes[0],job=()=>find(jobs,s.job)||jobs[0],info=it=>it.kind==='car'?find(cars,it.id):find(goods,it.id),owned=()=>s.items.filter(x=>info(x));
let tab='overview',message='',category='Alle',tier='Alle';
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function log(t){s.events.unshift({day:s.day,text:t});s.events=s.events.slice(0,70)}
function transaction(n,t){s.money+=n;s.bank.unshift({day:s.day,label:t,amount:n});s.bank=s.bank.slice(0,250)}
function costs(){return commuteCost()+localRent(home())+home().energy+car().cost+({cheap:170,normal:310,healthy:470}[s.food]||310)+Math.round(s.debt>0?Math.min(120,s.debt):0)+(s.hobby==='sport'?55:0)}
const places=[
{id:'zentrum',name:'Stadtzentrum',km:2,emoji:'🏙️',x:50,y:47,desc:'Kurzer Weg zur Arbeit · hohe Wohnkosten',factor:1.35},
{id:'vorstadt',name:'Vorstadt',km:8,emoji:'🏘️',x:72,y:32,desc:'Ruhiges Wohnen · mittlere Wege',factor:1.1},
{id:'dorf',name:'Dorf am See',km:22,emoji:'🌳',x:20,y:29,desc:'Günstiger wohnen · längerer Arbeitsweg',factor:.78},
{id:'land',name:'Landdorf',km:38,emoji:'🚜',x:76,y:76,desc:'Sehr günstiges Wohnen · weiter Arbeitsweg',factor:.63},
{id:'wald',name:'Walddorf',km:15,emoji:'🌲',x:22,y:77,desc:'Natur und Ruhe · Pendelkosten',factor:.88}
];
function place(){return places.find(p=>p.id===s.location)||places[0]}
function commuteCost(){let km=place().km,perKm=s.car==='none'?.26:.19;return Math.round(km*2*22*perKm)}
function localRent(h){return Math.round(h.rent*place().factor)}
function choosePlace(id){let p=places.find(x=>x.id===id);if(!p)return;act(()=>{if(s.location===id)return;pay(180,'Umzug nach '+p.name);s.location=id;log('📍 Neuer Wohnort: '+p.name)})}
function cityMap(){let nodes=places.map(p=>'<button class="map-pin '+(place().id===p.id?'chosen':'')+'" style="left:'+p.x+'%;top:'+p.y+'%" onclick="choosePlace(\''+p.id+'\')"><span>'+p.emoji+'</span><small>'+p.name+'</small></button>').join('');return '<div class="map-scene"><div class="map-water"></div><div class="map-road road-a"></div><div class="map-road road-b"></div><div class="map-road road-c"></div>'+nodes+'</div>'}
function mapPage(){return card('🗺️ Stadtkarte & Dörfer','<p>Tippe auf einen Ort, um dort zu wohnen. Dein Arbeitsplatz bleibt im Stadtzentrum. Je weiter du pendelst, desto höher die monatlichen Fahrtkosten.</p>'+cityMap()+'<div class="place-list">'+places.map(p=>'<div class="item row"><span><strong>'+p.emoji+' '+p.name+(p.id===place().id?' ✓':'')+'</strong><br><small>'+p.desc+' · '+p.km+' km einfach</small><br><small>WG-Miete: '+fmt(Math.round(homes[0].rent*p.factor))+' · Fahrtkosten: '+fmt(Math.round(p.km*44*(s.car==='none'?.26:.19)))+'/Monat</small></span>'+btn(p.id===place().id?'Wohnort':'Hier wohnen',`choosePlace(\'${p.id}\')`,p.id===place().id?'active':'')+'</div>').join('')+'</div><p class="muted">Ortswechsel: einmalig 180 €. Pendelkosten werden jeden Spielmonat automatisch abgezogen. Ohne Auto nutzt du öffentliche Verkehrsmittel.</p>')}
function net(){return Math.round((job().salary+(s.raise||0)+Math.min(1000,s.experience*35))*.74)}
function mood(){let ids=[...new Set(s.items.filter(x=>!x.broken&&x.kind!=='car').map(x=>x.id))];return Math.max(0,Math.min(100,Math.round(s.baseMood+(home().comfort-55)*.3+car().comfort+ids.reduce((a,id)=>a+(find(goods,id)?.comfort||0),0)-s.stress*.22-s.items.filter(x=>x.broken).length*7)))}
function tick(n){for(let j=0;j<n;j++){s.day++;if(s.day%30===0){transaction(net(),'Monatsgehalt');transaction(-costs(),'Monatliche Fixkosten');if(s.debt>0)s.debt=Math.max(0,s.debt-120)}if(s.day%2===0)for(let l of s.listings){if(s.offers.some(o=>o.uid===l.uid))continue;let it=s.items.find(x=>x.uid===l.uid);if(!it)continue;let g=info(it);let market=g.price*(it.broken?.15:.6);let chance=Math.max(.05,Math.min(.75,market/l.price*.4));if(Math.random()<chance){let bid=Math.round(Math.min(l.price,market)*(.83+Math.random()*.17));s.offers.push({uid:l.uid,bid});log('💬 Kaufangebot: '+g.name+' für '+fmt(bid))}}if(s.studyUntil&&s.day>=s.studyUntil){s.level++;s.studyUntil=0;log('🎓 Weiterbildung abgeschlossen.')}}save()}
function sync(){let n=Math.floor((Date.now()-s.stamp)/DAY);if(n>0){tick(Math.min(n,240));s.stamp+=n*DAY;save()}}sync();
function act(f){try{sync();f();save();message='';render()}catch(e){message=e.message;render()}}
function pay(n,t){if(s.money<n)throw Error('Nicht genug Geld. Es fehlen '+fmt(n-s.money)+'.');transaction(-n,t)}
function buy(id,used=false){let g=find(goods,id),n=s.items.filter(x=>x.id===id).length;if(n&&!confirm('Du besitzt bereits '+n+' × '+g.name+'. Möchtest du noch einen kaufen?'))return;act(()=>{let p=used?Math.round(g.price*.62):g.price;pay(p,(used?'Kleinanzeigen: ':'Shop: ')+g.name);s.items.push({uid:crypto.randomUUID(),id,day:s.day,broken:false,paid:p});log('🛍️ '+g.name+' gekauft für '+fmt(p))})}
function buyCar(id){let c=find(cars,id);if(!c||c.id===s.car)return;act(()=>{if(c.price)pay(c.price,'Autokauf: '+c.name);if(s.car!=='none')s.items.push({uid:crypto.randomUUID(),id:s.car,kind:'car',day:s.day,broken:false});s.car=id;log('🚗 Fahrzeugwechsel: '+c.name+'. Vorheriges Auto ins Inventar gelegt.')})}
function listItem(uid){let it=s.items.find(x=>x.uid===uid);if(!it)return;let g=info(it);let v=prompt('Wunschpreis für '+g.name+' in Euro:',Math.round(g.price*.7));if(v===null)return;let price=Number(v.replace(',','.'));if(!Number.isFinite(price)||price<=0){message='Ungültiger Preis';render();return}act(()=>{if(s.listings.some(l=>l.uid===uid))throw Error('Bereits inseriert');s.listings.push({uid,price,day:s.day});log('🛒 Inseriert: '+g.name+' für '+fmt(price))})}
function delListing(uid){act(()=>{s.listings=s.listings.filter(x=>x.uid!==uid);s.offers=s.offers.filter(x=>x.uid!==uid)})}
function accept(uid){act(()=>{let it=s.items.find(x=>x.uid===uid),o=s.offers.find(x=>x.uid===uid);if(!it||!o)throw Error('Angebot nicht gefunden');transaction(o.bid,'Kleinanzeigen-Verkauf: '+info(it).name);s.items=s.items.filter(x=>x.uid!==uid);s.listings=s.listings.filter(x=>x.uid!==uid);s.offers=s.offers.filter(x=>x.uid!==uid);log('🤝 Verkauf abgeschlossen für '+fmt(o.bid))})}
function reject(uid){act(()=>{s.offers=s.offers.filter(x=>x.uid!==uid);log('Kaufangebot abgelehnt')})}
function counter(uid){let o=s.offers.find(x=>x.uid===uid),l=s.listings.find(x=>x.uid===uid);if(!o||!l)return;let x=prompt('Dein Gegenangebot in Euro:',l.price);if(x===null)return;let p=Number(x.replace(',','.'));if(!(p>0))return;act(()=>{if(p<=o.bid*1.08||Math.random()<.3){o.bid=Math.round(p);log('🤝 Käufer akzeptiert Gegenangebot')}else{s.offers=s.offers.filter(x=>x.uid!==uid);log('Käufer hat Gegenangebot abgelehnt')}})}
function moveHome(id){let h=find(homes,id);if(!h)return;act(()=>{pay(Math.round(localRent(h)*.7),'Umzug');s.home=id;log('🏠 Umzug: '+h.name)})}
function work(){act(()=>{if(s.lastWork===s.day)throw Error('Heute bereits gearbeitet');s.lastWork=s.day;s.experience++;s.stress=Math.min(100,s.stress+3);transaction(55,'Arbeitsbonus');log('💼 Arbeitstag abgeschlossen')})}
function study(){act(()=>{if(s.studyUntil)throw Error('Weiterbildung läuft');pay(450+s.level*280,'Weiterbildung');s.studyUntil=s.day+10;log('🎓 Weiterbildung gestartet')})}
function jobChange(id){let j=find(jobs,id);act(()=>{if(s.level<j.need)throw Error('Qualifikation zu niedrig');s.job=id;s.experience=0;log('💼 Neuer Beruf: '+j.name)})}
function repair(uid){act(()=>{let it=s.items.find(x=>x.uid===uid),g=info(it);if(!it||!it.broken)throw Error('Keine Reparatur nötig');pay(g.repair||Math.round(g.price*.3),'Reparatur');it.broken=false})}
function borrow(){act(()=>{if(s.debt>3000)throw Error('Kreditlimit erreicht');transaction(1000,'Kredit');s.debt+=1120})}
function line(k,v){return '<div class="row line"><span>'+k+'</span><strong>'+v+'</strong></div>'}
function card(t,b){return '<section class="card"><h2>'+t+'</h2>'+b+'</section>'}
function btn(t,f,cl=''){return '<button class="'+cl+'" onclick="'+f+'">'+t+'</button>'}
function overview(){return '<div class="grid">'+card('🏦 Finanzen',line('Kontostand',fmt(s.money))+line('Monatliches Netto',fmt(net()))+line('Monatliche Kosten',fmt(costs()))+line('Pendeln / Monat',fmt(commuteCost()))+line('Überschuss',fmt(net()-costs()))+btn('Bankkonto',`go('bank')`))+card('❤️ Dein Leben',line('Beruf',job().name)+line('Zuhause',home().name+' · '+place().name)+line('Auto',car().name)+line('Zufriedenheit',mood()+'/100')+line('Besitzgegenstände',s.items.length)+btn('Arbeiten','work()'))+card('🎯 Deine Ziele','Kaufe Dinge, verbessere deine Lebensqualität und verkaufe Besitz über Kleinanzeigen.<div class="actions">'+btn('Shop',`go('shop')`)+btn('Inventar',`go('inventory')`)+btn('Kleinanzeigen',`go('market')`)+'</div>')+card('📰 Ereignisse',s.events.slice(0,8).map(x=>line('Tag '+x.day,esc(x.text))).join('')||'Dein Leben beginnt!')+'</div>'}
function bank(){return '<div class="grid">'+card('💳 WORLD BANK',line('Kontostand',fmt(s.money))+line('Netto / Monat',fmt(net()))+line('Fixkosten / Monat',fmt(costs()))+line('Kredit offen',fmt(s.debt))+btn('1.000 € Kredit','borrow()'))+card('📃 Kontoauszug',s.bank.map(x=>line('Tag '+x.day+' · '+esc(x.label),(x.amount>0?'+':'')+fmt(x.amount))).join('')||'Noch keine Buchungen')+'</div>'}
function career(){return '<div class="grid">'+card('💼 Beruf',line('Aktuell',job().name)+line('Netto',fmt(net()))+line('Erfahrung',s.experience)+line('Qualifikation',s.level)+btn('Arbeiten','work()')+' '+btn('Weiterbildung · '+fmt(450+s.level*280),'study()'))+card('📋 Stellenmarkt',jobs.map(j=>'<div class="item row"><span>'+j.name+'<br><small>'+fmt(j.salary)+' brutto · Stufe '+j.need+'</small></span>'+btn('Wählen',`jobChange('${j.id}')`)+'</div>').join(''))+'</div>'}
function housing(){return '<div class="grid">'+card('🏠 Dein Zuhause',line('Wohnung',home().name)+line('Miete am Wohnort',fmt(localRent(home())))+line('Nebenkosten',fmt(home().energy))+homes.map(h=>'<div class="item row"><span>'+h.name+'<br><small>'+fmt(h.rent)+'/Monat</small></span>'+btn('Umziehen',`moveHome('${h.id}')`)+'</div>').join(''))+card('🚗 Dein Auto',line('Aktuell',car().name)+line('Unterhalt / Monat',fmt(car().cost))+'<p class="muted">Beim Fahrzeugwechsel kommt dein altes Auto ins Inventar. Von dort kannst du es inserieren.</p>')+card('🚘 Automarkt',cars.filter(x=>x.id!=='none').map(c=>'<div class="item row"><span>'+esc(c.name)+'<br><small>'+fmt(c.price)+' · '+fmt(c.cost)+'/Monat</small></span>'+btn('Kaufen',`buyCar('${c.id}')`)+'</div>').join(''))+'</div>'}
function shop(){let opts=['Alle',...new Set(goods.map(x=>x.category))];let shown=goods.filter(x=>(category==='Alle'||x.category===category)&&(tier==='Alle'||String(x.tier)===tier));return card('🛍️ Weltweiter Shop · 3 Preisstufen','<div class="actions"><select onchange="category=this.value;render()">'+opts.map(x=>'<option '+(x===category?'selected':'')+'>'+x+'</option>').join('')+'</select><select onchange="tier=this.value;render()">'+[['Alle','Alle'],['0','Günstig'],['1','Mittelklasse'],['2','Luxus']].map(([v,n])=>'<option value="'+v+'" '+(v===tier?'selected':'')+'>'+n+'</option>').join('')+'</select></div>')+'<div class="grid">'+shown.map(g=>card(esc(g.name),line('Preis',fmt(g.price))+line('Qualitätsstufe',g.tier===undefined?'Klassiker':['Günstig','Mittelklasse','Luxus'][g.tier])+line('Lebensqualität','+'+g.comfort)+btn('Kaufen',`buy('${g.id}')`))).join('')+'</div>'}
function inventory(){let count={};for(let it of owned())count[info(it).name]=(count[info(it).name]||0)+1;return '<div class="grid">'+card('📦 Dein Inventar',line('Gegenstände',s.items.length)+line('Aktuelles Auto',car().name)+line('Neuwert des Inventars',fmt(owned().reduce((a,x)=>a+info(x).price,0)))+Object.entries(count).map(([n,c])=>line(esc(n),c+' ×')).join(''))+card('📋 Gegenstände einzeln',owned().map(it=>'<div class="item"><strong>'+esc(info(it).name)+'</strong> · '+(it.broken?'Defekt':'Funktioniert')+'<br><small>Spieltag '+it.day+' · Neupreis '+fmt(info(it).price)+'</small><div class="actions">'+(s.listings.some(x=>x.uid===it.uid)?'<span>Bereits inseriert</span>':btn('Bei Kleinanzeigen einstellen',`listItem('${it.uid}')`))+(it.broken?btn('Reparieren',`repair('${it.uid}')`):'')+'</div></div>').join('')||'Du besitzt noch keine Gegenstände.')+'</div>'}
function market(){return '<div class="grid">'+card('🛒 Deine Kleinanzeigen',s.listings.map(l=>{let it=s.items.find(x=>x.uid===l.uid);if(!it)return '';let o=s.offers.find(x=>x.uid===l.uid);return '<div class="item"><strong>'+esc(info(it).name)+'</strong>'+line('Dein Wunschpreis',fmt(l.price))+(o?'<div class="notice">Interessent bietet '+fmt(o.bid)+'</div><div class="actions">'+btn('Annehmen',`accept('${l.uid}')`)+btn('Gegenangebot',`counter('${l.uid}')`)+btn('Ablehnen',`reject('${l.uid}')`,'danger')+'</div>':'<small>Noch kein Interessent. Angebote können im Laufe der Spieltage kommen.</small>')+'<div class="actions">'+btn('Anzeige entfernen',`delListing('${l.uid}')`,'danger')+'</div></div>'}).join('')||'Noch keine Anzeigen. Inseriere etwas aus deinem Inventar.')+btn('Zum Inventar',`go('inventory')`)+card('🏷️ Gebrauchtangebote',goods.slice(0,24).map(g=>'<div class="item row"><span>'+esc(g.name)+'</span>'+btn('Kaufen · '+fmt(g.price*.62),`buy('${g.id}',true)`)+'</div>').join(''))+'</div>'}
function life(){return '<div class="grid">'+card('❤️ Gesundheit',line('Gesundheit',s.health+'/100')+line('Stress',s.stress+'/100')+line('Zufriedenheit',mood()+'/100')+btn('Erholen',`act(()=>{s.stress=Math.max(0,s.stress-10);s.health=Math.min(100,s.health+2)})`))+card('🥗 Ernährung',line('Aktuell',s.food)+[['cheap','Sparsam'],['normal','Ausgewogen'],['healthy','Gesund']].map(([id,n])=>btn(n,`act(()=>{s.food='${id}'})`)).join(' '))+'</div>'}
function test(){return '<div class="grid">'+card('⏱️ Teststeuerung',line('Spieltag',s.day)+'1 Spieltag = 60 echte Minuten.<div class="actions">'+btn('+1 Tag','act(()=>tick(1))')+btn('+7 Tage','act(()=>tick(7))')+btn('+30 Tage','act(()=>tick(30))')+'</div>')+card('⚙️ Spielstand','Deine Daten bleiben in diesem Browser gespeichert. Die vorhandenen Gegenstände aus Test 3.0 werden übernommen.<div class="actions">'+btn('Neues Spiel',`if(confirm('Spielstand löschen?')){s=fresh();save();go('overview')}`,'danger')+'</div>')+'</div>'}
const pages={map:['🗺️ Stadtkarte',mapPage],overview:['🏠 Übersicht',overview],bank:['💳 Bank',bank],career:['💼 Beruf',career],housing:['🏘️ Wohnen & Auto',housing],shop:['🛍️ Shop',shop],inventory:['📦 Inventar',inventory],market:['🛒 Kleinanzeigen',market],life:['❤️ Leben',life],test:['⏱️ Test',test]};
function go(x){tab=x;message='';render()}
function render(){document.getElementById('clock').textContent='Spieltag '+s.day+' · 60 Minuten = 1 Tag';document.getElementById('stats').innerHTML=[['Kontostand',fmt(s.money)],['Netto / Monat',fmt(net())],['Fixkosten / Monat',fmt(costs())],['Zufriedenheit',mood()+'/100']].map(([k,v])=>'<div class="stat"><small>'+k+'</small><strong>'+v+'</strong></div>').join('');document.getElementById('nav').innerHTML=Object.entries(pages).map(([id,[name]])=>btn(name,`go('${id}')`,id===tab?'active':'')).join('');document.getElementById('message').innerHTML=message?'<div class="notice">'+esc(message)+'</div>':'';document.getElementById('view').innerHTML=pages[tab][1]()}
try{render()}catch(e){document.getElementById('message').textContent='⚠️ Startfehler: '+e.message+' — bitte Screenshot schicken.'}setInterval(()=>{try{sync();render()}catch(e){document.getElementById('message').textContent='⚠️ Fehler: '+e.message}},30000);
</script></html>
